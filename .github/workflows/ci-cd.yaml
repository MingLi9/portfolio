name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: List remote / (debug)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        port: ${{ secrets.SFTP_PORT }}
        script: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== PORTFOLIO ==="
          ls -la portfolio || echo "portfolio not found"

    - name: Show build context
      run: |
        echo "Branch: $GITHUB_REF"
        echo "Repo: $GITHUB_REPOSITORY"
        ls -la

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: CI=false npm run build

    # 🔍 Debug: check wat je gaat deployen
    - name: Inspect build output
      run: |
        echo "Build output:"
        ls -la build
        echo "Index check:"
        cat build/index.html | head -n 20

    # 🧪 Safety check: voorkomen lege deploy
    - name: Validate build exists
      run: |
        if [ ! -f build/index.html ]; then
          echo "ERROR: build/index.html not found"
          exit 1
        fi

    # 🚀 Deploy via SFTP
    - name: Deploy to STRATO portfolio folder
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        port: ${{ secrets.SFTP_PORT }}

        source: "build/*"
        target: "/portfolio"

        strip_components: 1

    # 🧾 Post-deploy logging (zichtbaar in Actions log)
    - name: Deployment summary
      run: |
        echo "Deployed to: /portfolio"
        echo "Files pushed:"
        ls -la build